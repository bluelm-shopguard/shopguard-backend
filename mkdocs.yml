site_name: bluelm-shopguard 后端文档
site_description: vivo BlueLM OpenAI 兼容的消费者保护 API 服务器
site_author: bluelm-shopguard 团队
site_url: https://shopguard-backend.readthedocs.io

# Language
# The language code for the documentation, set to Chinese (Simplified)
docs_dir: docs

# Repository
repo_name: shopguard-backend
repo_url: https://github.com/your-org/shopguard-backend

# Configuration
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator:
        !!python/name:material.extensions.emoji.to_svg # Navigation


nav:
  - 首页: README.md
  - 入门指南:
      - 快速开始: quick-start.md
      - 配置指南: configuration-guide.md
  - API 文档:
      - API 参考: api-reference.md
      - 图片输入指南: how-to-image-input.md
      - 网页搜索指南: how-to-web-search.md
  - 部署:
      - 生产环境部署: production-deployment.md
      - 中国大陆部署: host docker image and server in China.md
      - 阿里云 ECS SSH: how to ssh aliyun ECS.md

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/shopguard-backend
  version:
    provider: mike

# Copyright
copyright: 版权所有 &copy; 2025 bluelm-shopguard 团队
